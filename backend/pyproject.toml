[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dhairya", email = "dhairyajain26@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.157.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiofiles>=25.1.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
    "markitdown>=0.1.9",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "charset-normalizer>=3.5.2",
    "openpyxl>=3.1.5",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1"
]
